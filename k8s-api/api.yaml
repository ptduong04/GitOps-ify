apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api
  namespace: demo
  labels:
    app: api
spec:
  replicas: 4
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: flask-api:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: VERSION
          value: "v1"
        - name: INJECT_ERROR_RATE
          value: "0"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
  strategy:
    canary:
      stableService: api-stable
      canaryService: api-canary
      steps:
      - setWeight: 25
      - analysis:
          templates:
          - templateName: api-canary-smoke
      - setWeight: 50
      - pause: { duration: 30s }
      - setWeight: 100

---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: api-canary-smoke
  namespace: demo
spec:
  metrics:
  - name: api-canary-smoke
    count: 1
    failureLimit: 0
    provider:
      job:
        spec:
          backoffLimit: 0
          template:
            spec:
              restartPolicy: Never
              containers:
              - name: smoke
                image: flask-api:v1
                imagePullPolicy: IfNotPresent
                command: ["python", "-c"]
                args:
                - |
                  import sys, time, urllib.request
                  failures = 0
                  for _ in range(40):
                      try:
                          response = urllib.request.urlopen("http://api-canary.demo.svc.cluster.local/api", timeout=2)
                          if response.status >= 500:
                              failures += 1
                      except Exception:
                          failures += 1
                      time.sleep(0.2)
                  sys.exit(1 if failures else 0)

---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: demo
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
  - port: 80
    targetPort: 8080
    name: http
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: api-stable
  namespace: demo
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
  - port: 80
    targetPort: 8080
    name: http
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: api-canary
  namespace: demo
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
  - port: 80
    targetPort: 8080
    name: http
  type: ClusterIP
