apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  
  source:
    repoURL: https://github.com/ptduong04/GitOps-ify.git
    targetRevision: HEAD
    path: k8s-frontend
  
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
